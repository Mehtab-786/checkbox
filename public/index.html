<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkboxes</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 2.5rem;
            margin: 0;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        #container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            max-width: 1000px;
        }

        input[type="checkbox"] {
            width: 30px;
            height: 30px;
            cursor: pointer;
            accent-color: #6366f1;
        }
    </style>
</head>

<body>
    <h1>Checkboxes</h1>
    <div id="container"></div>


    <script src="/socket.io/socket.io.js"></script>
    <script>
        const container = document.getElementById('container');

        const socket = io()

        let dummyData = [];

        window.addEventListener('load', async () => {
            const response = await fetch('/checkboxes', { method: 'GET' })
            const { data } = await response.json()
            dummyData = data
            loadCheckboxes(data)
        })

        socket.on('updated-checkbox', (data) => {
            let element = document.querySelector(`[data-id="${data.id}"]`)
            if (element) element.checked = data.isChecked

            dummyData = dummyData.map(item => item.id === data.id ? { ...item, isChecked: data.isChecked } : item)
        })

        function loadCheckboxes(data) {
            try {
                const items = data || [];

                container.innerHTML = '';
                items.forEach(item => {
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = item.isChecked;
                    checkbox.dataset.id = item.id
                    checkbox.addEventListener('change', () => {
                        item.isChecked = checkbox.checked;
                        socket.emit('checkbox-update', item)

                    });
                    container.appendChild(checkbox);
                });
            } catch (err) {
                console.error('Error loading data:', err);
            }
        }

    </script>
</body>

</html>
